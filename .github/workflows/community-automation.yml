name: Community Automation

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Contributor
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const author = context.actor;
            
            // Skip automated bot accounts
            if (author.endsWith('[bot]') || author === 'github-actions') return;
            
            let message = '';
            if (isPR) {
              message = `### 🎉 Thank you for contributing to Workshops, @${author}!\n\nWelcome to **AIML Club OCT**! 🚀\n\nA maintainer will review your workshop notebooks or materials shortly.\n- 🚀 Make sure all notebooks include the 1-click **Open In Colab** badge.\n- 💡 Share suggestions in our [Q&A Discussion Thread](https://github.com/orgs/AIMLCLUBOCT/discussions/2).\n\nHappy coding! 💻✨`;
            } else {
              message = `### 👋 Hi @${author}, thanks for reaching out!\n\nWelcome to **AIML Club OCT Workshops**!\n\n- If this is a new workshop notebook idea or bug report, our team will review it soon.\n- If you'd like to author this notebook yourself, let us know and we'll assign you!\n\nHappy learning! 🚀`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
